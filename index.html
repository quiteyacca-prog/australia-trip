<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe7">
  <title>澳洲国庆旅行计划 · Australia Holiday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__top"><span>AUSTRALIA · 2026</span></div>
    <div class="hero__content">
      <p class="eyebrow">国庆假期旅行手册 <span>/</span> NATIONAL DAY HOLIDAY</p>
      <h1>澳洲十日<br><em>漫游</em></h1>
      <p class="hero__intro">在南纬 33 度的风里，虚度一场。<br><span>Melbourne · Great Ocean Road · Tasmania · Sydney</span></p>
    </div>
    <div class="hero__route"><span>09.25</span><i></i><span>10.05</span></div>
  </header>

  <main>
    <section class="day-picker-wrap">
      <div class="section-heading"><p class="eyebrow">每日计划 / DAILY PLAN</p><span id="day-count"></span></div>
      <nav class="day-picker" id="day-picker" aria-label="选择旅行日期"></nav>
    </section>

    <section id="day-view" class="day-view" aria-live="polite"></section>
  </main>

  <footer><span>AUSTRALIA 2026</span><span>祝旅途愉快 · HAVE A WONDERFUL JOURNEY</span></footer>
  <script src="app.js"></script>
</body>
</html>
